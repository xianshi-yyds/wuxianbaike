小移动声","嗅觉帮助识别同类和猎物痕迹"])}),T({id:"snow-paws",title:"爪子",brief:"雪地行走和攀爬能力",x:45,y:67,coreExplanation:"宽脚掌能分散身体压力，脚底毛发增加摩擦和保暖，让雪豹在雪坡与碎石坡上更稳。",narration:"点击爪子会进入第二层，重点观察宽脚掌如何像雪鞋一样分散压力。",imagePrompt:"Snow leopard paws on snow and rock, visual encyclopedia cutaway.",childImagePrompt:"Close-up diagram of snow leopard paw pads, claws and footprint pressure.",targetLevelId:"snow-leopard-l2-paw"}),T({id:"snow-tail",title:"尾巴",brief:"平衡与保暖",x:67,y:55,coreExplanation:"长尾在跳跃和转身时像平衡杆，休息时还可以围住身体和面部减少热量散失。",narration:"雪豹长尾不是装饰，它连接着跳跃稳定性和寒夜保温。",imagePrompt:"Long snow leopard tail balancing on a cliff edge.",childImagePrompt:"Visual card showing tail as balance bar and warm wrap.",detail:_("尾巴的双重作用","雪豹在峭壁间移动时需要快速调整身体姿态，长尾能抵消转向时的晃动；休息时尾巴又像围巾。",["跳跃时保持身体重心","转身时减少失衡风险","低温中辅助保暖"])}),T({id:"snow-coat",title:"斑纹毛色",brief:"伪装机制",x:55,y:47,coreExplanation:"灰白毛色和斑点能打碎身体轮廓，让雪豹在岩石、阴影和雪地之间更难被发现。",narration:"斑纹毛色把雪豹的身体轮廓拆散，帮助它融入高山岩石和雪线阴影。",imagePrompt:"Snow leopard coat pattern blending with gray rocks and snow.",childImagePrompt:"Camouflage comparison between snow leopard spots and alpine rocks.",detail:_("斑纹为什么有效","伪装不是让动物完全隐形，而是让观察者难以快速识别轮廓、方向和距离。",["灰白色接近雪地和岩石","斑点打散身体边缘","伏击时降低被猎物发现概率"])}),T({id:"snow-rocks",title:"岩石环境",brief:"高山栖息地",x:76,y:71,coreExplanation:"岩壁、碎石坡和雪线构成雪豹的移动路线，也提供观察点、隐蔽点和伏击位置。",narration:"高山岩石不是背景，而是雪豹行动、隐蔽和捕猎的一部分。",imagePrompt:"Alpine cliff habitat with snow leopard routes and lookout points.",childImagePrompt:"Habitat map of cliffs, snow slopes and prey routes.",detail:_("岩石环境是行动地图","雪豹会利用岩石遮挡身体，沿坡脊移动，选择能看见猎物又不容易暴露的位置。",["岩壁提供隐蔽","坡脊便于观察","碎石坡影响追捕路线"])})]}),ge({id:"snow-leopard-l2-paw",title:"雪豹爪子：天然雪鞋如何工作",pathLabel:"爪子结构",subtitle:"把脚掌放大，理解肉垫、爪尖、面积、前肢和足迹。",imagePath:"generated-images/curated/curated-snow-leopard-paw-l2.png",fallbackTheme:"snow",imagePrompt:"Close-up snow leopard paw on snow, anatomy infographic style.",coreExplanation:"雪豹爪子的关键不是“锋利”一个点，而是面积、摩擦、力量和落地稳定性共同降低雪地与岩壁移动成本。",narration:"现在进入爪子层。肉垫吸收冲击，爪尖抓住岩缝，较大的脚掌面积分散压力，前肢力量支撑攀爬，足迹则记录它走过的路线。",hotspots:[T({id:"snow-pad",title:"肉垫",brief:"缓冲与摩擦",x:48,y:55,coreExplanation:"肉垫能吸收落地冲击，也能在冰雪和岩石表面提供一定摩擦。",narration:"肉垫像缓冲垫，帮助雪豹安静落地，也减少脚掌受伤。",imagePrompt:"Snow leopard paw pad close-up with pressure marks.",childImagePrompt:"Cutaway card of paw pad cushioning and grip.",detail:_("肉垫不是软弱部位","肉垫柔韧但耐磨，能让雪豹在不同地面上保持触感和稳定。",["吸收跳跃落地冲击","增加接触摩擦","帮助安静接近猎物"])}),T({id:"snow-claw-tip",title:"爪尖",brief:"抓地和攀爬",x:37,y:43,coreExplanation:"爪尖能扣住岩缝和硬雪边缘，帮助雪豹在陡坡上启动、制动和改变方向。",narration:"爪尖让雪豹在岩石和硬雪之间找到抓点，减少滑落风险。",imagePrompt:"Curved claw tips gripping icy rock.",childImagePrompt:"Detail card showing claw angles on rock cracks.",detail:_("爪尖提供抓点","在陡峭地形中，抓点比速度更重要。爪尖让雪豹能短距离爆发，也能稳住身体。",["扣住岩缝","在硬雪上制动","配合前肢完成攀爬"])}),T({id:"snow-paw-area",title:"脚掌面积",brief:"分散压力",x:58,y:49,coreExplanation:"脚掌越宽，单位面积承受的压力越低，因此更不容易陷入松软雪层。",narration:"宽脚掌像雪鞋一样把重量摊开，是雪豹雪地行动的核心结构。",imagePrompt:"Comparison of wide snow leopard paw pressure on snow.",childImagePrompt:"Pressure map comparing wide paw and narrow paw.",detail:_("天然雪鞋原理","同样体重压在更大的接触面积上，雪面承受的压力变小，陷入深度也会降低。",["降低单位面积压力","提高雪面通过性","节省移动体力"])}),T({id:"snow-forelimb",title:"前肢力量",brief:"攀爬与落地支撑",x:66,y:61,coreExplanation:"强壮前肢可以承接跳跃落地的冲击，也能在攀爬时把身体拉上岩面。",narration:"前肢力量决定雪豹能不能稳稳落地，也影响它能否在岩壁间转移。",imagePrompt:"Snow leopard forelimb muscles supporting a landing.",childImagePrompt:"Muscle force diagram for climbing and landing.",detail:_("前肢承担冲击","雪豹跳跃落地时，前肢会先接触地面并吸收冲击，随后身体重心才稳定下来。",["承接落地冲击","辅助攀爬牵引","配合尾巴保持平衡"])}),T({id:"snow-footprint",title:"足迹",brief:"研究者识别路线",x:72,y:75,coreExplanation:"足迹记录脚掌大小、步距、方向和雪层状态，是研究雪豹活动的重要线索。",narration:"点击足迹进入第三层，研究者会从脚印里读出路线、速度和环境信息。",imagePrompt:"Snow leopard footprints crossing a snowy ridge.",childImagePrompt:"Field guide page for reading snow leopard footprints.",imagePath:"generated-images/curated/curated-snow-leopard-track-l2.png",targetLevelId:"snow-leopard-l3-footprint"})]}),ge({id:"snow-leopard-l3-footprint",title:"雪豹足迹：雪地里的行动记录",pathLabel:"足迹识别",subtitle:"从大小、步距、方向、雪层和伴随痕迹判断行动状态。",imagePath:"generated-images/curated/curated-snow-leopard-track-l3.png",fallbackTheme:"snow-tracks",imagePrompt:"Snow field with snow leopard tracks, measuring marks and direction arrows.",coreExplanation:"足迹像雪地里的临时档案。它不能直接告诉我们全部故事，却能把动物体型、移动方向、速度变化和环境条件串联起来。",narration:"第三层关注足迹识别。足迹大小提示个体体型，步距反映移动速度，路径方向显示路线，雪层深度影响清晰度，伴随痕迹可能提示捕猎或停留。",hotspots:[T({id:"track-size",title:"足迹大小",brief:"估计个体体型",x:35,y:48,coreExplanation:"较大的足迹通常意味着更大的脚掌和个体，但还需要结合雪层变形判断。",narration:"足迹大小能帮助研究者估计个体体型，但不能单独当成绝对证据。",imagePrompt:"Measuring snow leopard paw print diameter in snow.",childImagePrompt:"Measurement card for footprint size.",detail:_("足迹大小要谨慎读","松雪会让脚印边缘塌陷，看起来比实际更大；硬雪又可能只留下浅痕。",["可辅助估计个体体型","受雪层软硬影响","需要多枚足迹互相校验"])}),T({id:"track-stride",title:"步距",brief:"判断移动速度",x:49,y:57,coreExplanation:"连续足迹之间的距离能反映动物是在慢走、加速还是跳跃通过。",narration:"步距就像节奏记录，能看出雪豹是在巡视、追踪还是快速通过。",imagePrompt:"Series of footprints with stride length marks.",childImagePrompt:"Stride comparison diagram.",detail:_("步距记录行动节奏","同一方向的连续足迹如果间距突然变大，可能意味着动物加速或地形改变。",["短步距常见于谨慎移动","长步距可能对应加速","坡度会改变步距"])}),T({id:"track-direction",title:"路径方向",brief:"推断移动路线",x:63,y:44,coreExplanation:"足迹排列方向能显示雪豹从哪里来、往哪里去，并帮助布设红外相机。",narration:"路径方向把单个脚印连成行动路线，是野外调查的重要依据。",imagePrompt:"Snow track path with arrows along a ridge.",childImagePrompt:"Route inference card for wildlife tracking.",detail:_("方向比单个脚印更重要","研究者通常不会只看一个脚印，而是沿着路径观察地形、遮蔽物和可能的猎物活动点。",["连接多个观察点","辅助相机布设","判断是否靠近猎物路线"])}),T({id:"track-snow-depth",title:"雪层深度",brief:"影响足迹清晰度",x:74,y:64,coreExplanation:"雪层越松软，足迹越深但边缘越容易变形；硬雪可能只留下浅浅的爪痕。",narration:"雪层深度决定足迹保存方式，也会影响研究者对大小和速度的判断。",imagePrompt:"Cross section of shallow and deep snow tracks.",childImagePrompt:"Snow depth and footprint clarity diagram.",detail:_("雪层会改变证据形状","同一只动物在不同雪层上留下的足迹可能差异很大，所以必须记录现场环境。",["深雪脚印更深","松雪边缘易塌","硬雪可能只留浅痕"])}),T({id:"track-companion",title:"伴随痕迹",brief:"毛发、粪便和拖痕",x:24,y:70,coreExplanation:"足迹附近的毛发、粪便、拖痕或猎物痕迹能让判断更完整。",narration:"伴随痕迹能把脚印从一串形状变成更完整的生态线索。",imagePrompt:"Wildlife trail with paw prints, fur and scat markers.",childImagePrompt:"Field evidence card for wildlife tracking.",detail:_("伴随痕迹补全故事","粪便可用于 DNA 或食性分析，拖痕可能提示捕猎，毛发则可能帮助确认物种。",["粪便可做食性分析","拖痕提示捕猎行为","毛发帮助确认物种"])})]})]},{id:"curated-shanghai",title:"上海",category:"城市百科",scenario:"城市更新 / 滨水空间研学",summary:"从黄浦江两岸进入城市天际线、历史建筑、交通网络和街区生活。",rootLevelId:"shanghai-l1",levels:[ge({id:"shanghai-l1",title:"上海：一条江如何组织城市",pathLabel:"上海总览",subtitle:"观察黄浦江、陆家嘴、外滩、地铁节点和里弄街区的关系。",fallbackTheme:"shanghai",imagePrompt:"Shanghai skyline across Huangpu River, atlas infographic with river, Bund and Lujiazui.",coreExplanation:"上海的城市形象并不只来自高楼，而是由黄浦江、历史岸线、金融中心、轨道交通和生活街区共同组织。",narration:"这一层看上海总览。黄浦江把城市分成两岸，也把交通、景观、商业和历史记忆连接起来。",hotspots:[T({id:"sh-river",title:"黄浦江",brief:"城市骨架与滨水空间",x:48,y:55,coreExplanation:"黄浦江既是水运通道，也是城市景观轴线，两岸功能变化记录了上海城市更新过程。",narration:"点击黄浦江进入第二层，观察滨水空间如何连接交通、防洪、休闲和城市形象。",imagePrompt:"Huangpu River waterfront with embankment and skyline.",childImagePrompt:"Shanghai waterfront section with flood wall, ferry and promenade.",targetLevelId:"shanghai-l2-riverfront"}),T({id:"sh-lujiazui",title:"陆家嘴高楼",brief:"金融中心天际线",x:67,y:36,coreExplanation:"陆家嘴高楼群把金融办公、城市地标和视觉识别合在一起，形成上海的现代城市名片。",narration:"陆家嘴高楼群是经济功能和城市形象叠加的结果。",imagePrompt:"Lujiazui skyscrapers annotated with finance district labels.",childImagePrompt:"Detail card for skyline, office towers and public decks.",detail:_("天际线背后的功能","高楼不仅用于观看，也承载金融办公、公共观景和城市品牌传播。",["金融办公高度集中","地标强化城市识别","公共空间与商业连接"])}),T({id:"sh-bund",title:"外滩立面",brief:"历史建筑和城市记忆",x:30,y:42,coreExplanation:"外滩建筑立面记录了近代上海的金融贸易历史，也塑造了游客对城市的第一印象。",narration:"外滩不是单栋建筑，而是一整段城市记忆的连续界面。",imagePrompt:"The Bund historic facades as a visual timeline.",childImagePrompt:"Facade details linking architecture, banking and trade history.",detail:_("外滩是一段历史界面","沿江建筑把近代贸易、银行、港口和公共空间联系起来，是理解上海历史的重要入口。",["建筑立面形成连续城市界面","金融和贸易功能曾高度集中","夜景强化公共记忆"])}),T({id:"sh-metro",title:"地铁节点",brief:"高密度通勤网络",x:55,y:72,coreExplanation:"地铁把商业中心、居住区和滨水景观连接起来，是高密度城市日常运转的基础。",narration:"地铁节点让城市不只靠道路扩张，而是通过轨道网络组织日常生活。",imagePrompt:"Shanghai metro nodes connecting riverfront and districts.",childImagePrompt:"Metro interchange diagram for Shanghai urban mobility.",detail:_("地铁是城市日常骨架","轨道交通把跨江出行、商业活动和居住通勤连接在一张网络里。",["提高跨区可达性","支撑高强度通勤","带动车站周边发展"])}),T({id:"sh-lilong",title:"里弄街区",brief:"日常生活肌理",x:22,y:68,coreExplanation:"里弄街区承载着上海的居住记忆，和高楼天际线一起构成城市的多层次面貌。",narration:"里弄让上海不只是远看的天际线，也有近距离的生活纹理。",imagePrompt:"Shanghai lilong lane houses with daily life details.",childImagePrompt:"Neighborhood card showing lane, doorway, shared courtyard and shops.",detail:_("城市记忆在街巷里","里弄空间体现了邻里交往、居住密度和街边服务，是理解城市生活的重要尺度。",["街巷尺度更贴近日常","共享空间形成邻里联系","更新需要平衡保护和改善"])})]}),ge({id:"shanghai-l2-riverfront",title:"黄浦江滨水：防洪、交通与公共生活",pathLabel:"黄浦江滨水",subtitle:"把江岸放大，看防洪墙、轮渡、步道、倒影和跨江通道。",fallbackTheme:"riverfront",imagePrompt:"Shanghai Huangpu riverfront with flood wall, ferry pier, promenade and skyline reflection.",coreExplanation:"滨水空间同时承担安全、交通、景观和公共生活功能。它既要挡住洪水，也要让人亲近城市的水岸。",narration:"第二层看黄浦江滨水。防洪墙保护城市，轮渡连接两岸，步道承载散步和观景，倒影形成城市形象，跨江通道支撑通勤。",hotspots:[T({id:"sh-floodwall",title:"防洪墙",brief:"城市安全边界",x:36,y:62,coreExplanation:"防洪设施是滨水城市的安全底线，需要在保护功能和亲水体验之间取得平衡。",narration:"防洪墙看起来不起眼，却决定滨水空间能否安全开放。",imagePrompt:"Flood wall along Shanghai riverfront with height marks.",childImagePrompt:"Section diagram of flood wall and public promenade.",detail:_("安全先于景观","滨水设计首先要面对水位变化和极端天气，再考虑步道、绿化和观景体验。",["抵御高水位风险","影响亲水空间高度","需要和步道系统结合"])}),T({id:"sh-ferry",title:"轮渡码头",brief:"低成本跨江方式",x:49,y:67,coreExplanation:"轮渡保留了跨江交通的日常尺度，也让人从水面重新观看城市两岸。",narration:"轮渡是交通工具，也是观察城市界面的移动视角。",imagePrompt:"Shanghai ferry pier with passengers and river view.",childImagePrompt:"Ferry route card connecting two banks of the river.",detail:_("轮渡连接两岸日常","在隧道和大桥之外，轮渡提供更慢但更直观的跨江方式，保留了水上城市经验。",["连接短距离跨江需求","保留水上通勤体验","提供观察两岸的视角"])}),T({id:"sh-promenade",title:"滨江步道",brief:"公共休闲空间",x:60,y:58,coreExplanation:"步道把原本偏工业或交通的岸线转化为公共活动空间，让市民能连续地接近江边。",narration:"滨江步道让岸线从边界变成公共生活场所。",imagePrompt:"Continuous riverfront promenade with walkers and cyclists.",childImagePrompt:"Public space card showing walking, cycling and seating zones.",detail:_("从岸线到公共空间","连续步道会改变人和江的关系，也让城市景观从远处背景变成日常路径。",["提高公共可达性","连接多个滨水节点","承载散步、跑步和观景"])}),T({id:"sh-reflection",title:"天际线倒影",brief:"城市形象传播",x:69,y:46,coreExplanation:"水面倒影会放大天际线的视觉记忆，使滨水景观更容易成为城市名片。",narration:"倒影不是功能设施，却会影响一座城市被观看和传播的方式。",imagePrompt:"Shanghai skyline reflection on river at dusk.",childImagePrompt:"Visual card about skyline reflection and city image.",detail:_("景观也是城市叙事","许多城市名片来自可重复拍摄的视角，水面、灯光和天际线共同强化识别度。",["强化视觉记忆","连接旅游和传播","依赖公共观景点"])}),T({id:"sh-crossing",title:"跨江通道",brief:"桥、隧道和轮渡协同",x:78,y:70,coreExplanation:"跨江通道决定两岸是否真正连成一个城市系统，桥、隧道和轮渡各自服务不同需求。",narration:"点击跨江通道进入第三层，看看桥、隧道和轮渡如何共同组织城市流动。",imagePrompt:"Shanghai river crossing network with bridge, tunnel and ferry labels.",childImagePrompt:"Diagram of tunnel entrance, bridge span, ferry route and interchange hub.",targetLevelId:"shanghai-l3-crossing"})]}),ge({id:"shanghai-l3-crossing",title:"跨江交通：两岸如何成为一个城市系统",pathLabel:"跨江交通",subtitle:"从隧道入口、桥梁跨度、轮渡航线、换乘枢纽和航运通道理解流动。",fallbackTheme:"cross-river",imagePrompt:"Shanghai cross-river mobility diagram with tunnels, bridges, ferry and shipping channel.",coreExplanation:"跨江交通不是单一设施，而是一组不同速度、容量和使用场景的通道，共同让城市两岸保持连续。",narration:"第三层看跨江交通。隧道承担高频车流，桥梁连接远距离道路，轮渡保留日常水上通勤，换乘枢纽接入轨道网络，航运通道继续服务城市物流。",hotspots:[T({id:"sh-tunnel",title:"隧道入口",brief:"高频车流组织",x:32,y:64,coreExplanation:"隧道把车辆引入地下跨江，能减少对江面和岸线景观的切割。",narration:"隧道入口要处理车流排队、匝道组织和安全通风。",imagePrompt:"Urban river tunnel entrance with traffic flow arrows.",childImagePrompt:"Tunnel entrance detail card.",detail:_("隧道把流量藏到地下","跨江隧道容量大，但对入口匝道、通风、安全和应急管理要求很高。",["服务机动车跨江","减少江面景观切割","需要复杂安全系统"])}),T({id:"sh-bridge",title:"桥梁跨度",brief:"连接道路网络",x:50,y:43,coreExplanation:"桥梁通过可见结构跨越江面，通常连接更大尺度的道路系统。",narration:"桥梁是城市连接的可见符号，也是一条高容量交通线。",imagePrompt:"Bridge span over Huangpu River with road network labels.",childImagePrompt:"Bridge structure card for traffic and skyline.",detail:_("桥梁是结构也是符号","桥不仅连接道路，还会成为城市视觉的一部分，因此工程和景观需要同时考虑。",["连接主干道路","形成城市地标","影响船舶通航高度"])}),T({id:"sh-ferry-route",title:"轮渡航线",brief:"慢速公共连接",x:45,y:70,coreExplanation:"轮渡容量较小但灵活，适合短距离、低成本和体验型跨江。",narration:"轮渡航线让人以水面视角穿过城市，而不是只把江当成障碍。",imagePrompt:"Ferry route line across river with pier markers.",childImagePrompt:"Ferry mobility detail card.",detail:_("慢交通也有价值","并非所有跨江需求都追求最快，轮渡保留了低速、开放和可观看的公共交通经验。",["短距离跨江","成本相对较低","强化水岸体验"])}),T({id:"sh-interchange",title:"换乘枢纽",brief:"接入轨道和公交",x:66,y:59,coreExplanation:"跨江通道只有接入轨道、公交和步行系统，才能真正服务大规模城市出行。",narration:"换乘枢纽把单条通道接入整座城市网络。",imagePrompt:"Transit interchange hub near river crossing.",childImagePrompt:"Interchange card with metro, bus and walking links.",detail:_("通道需要网络承接","如果桥隧两端缺少换乘和分流，跨江能力会被局部拥堵抵消。",["连接轨道和公交","分散跨江客流","减少单点拥堵"])}),T({id:"sh-shipping",title:"航运通道",brief:"物流与通航需求",x:74,y:47,coreExplanation:"城市滨水更新不能完全忘记航运功能，通航高度、水域管理和物流需求仍需协调。",narration:"航运通道提醒我们，江面既是景观，也是城市物流和水上交通空间。",imagePrompt:"River shipping lane with cargo vessel and city skyline.",childImagePrompt:"Shipping lane detail card.",detail:_("江面仍是基础设施","滨水空间越开放，越需要协调观景、交通、安全和航运之间的关系。",["保留通航能力","影响桥梁高度设计","需要水上交通管理"])})]})]},{id:"curated-dunhuang",title:"敦煌壁画",category:"历史百科",scenario:"艺术史启蒙 / 博物馆研学",summary:"从飞天、颜料、故事画面和洞窟结构进入丝路艺术与信仰世界。",rootLevelId:"dunhuang-l1",levels:[ge({id:"dunhuang-l1",title:"敦煌壁画：洞窟里的图像宇宙",pathLabel:"壁画总览",subtitle:"观察飞天、矿物颜料、故事画面、供养人和藻井结构。",fallbackTheme:"dunhuang",imagePrompt:"Dunhuang cave mural wall with apsaras, story panels, donors and ceiling pattern.",coreExplanation:"敦煌壁画把宗教信仰、丝路交流、音乐舞蹈、服饰和绘画技术压缩进洞窟空间，是图像化的历史档案。",narration:"这一层看敦煌壁画总览。飞天表现流动感，矿物颜料记录材料技术，故事画面传播信仰，供养人留下社会信息，洞窟顶部组织神圣空间。",hotspots:[T({id:"dh-apsaras",title:"飞天",brief:"流动姿态和丝路审美",x:50,y:35,coreExplanation:"飞天用飘带、姿态和乐舞表现轻盈感，融合了多地艺术语言。",narration:"点击飞天进入第二层，观察飘带、姿态、乐器和云气如何制造飞动感。",imagePrompt:"Dunhuang flying apsaras with ribbons and musical instruments.",childImagePrompt:"Close-up of apsaras ribbon, posture and instruments.",targetLevelId:"dunhuang-l2-apsaras"}),T({id:"dh-pigment",title:"矿物颜料",brief:"色彩材料与保存",x:28,y:58,coreExplanation:"壁画色彩来自矿物和植物等材料，颜色变化也记录了时间、光照和环境影响。",narration:"矿物颜料让壁画拥有稳定色彩，也让文物保护需要理解材料变化。",imagePrompt:"Mineral pigments used in Dunhuang mural painting.",childImagePrompt:"Pigment layer card with color and conservation notes.",detail:_("颜色是材料史","壁画颜色不是简单涂料，它涉及矿物来源、调和方式、墙面结构和长期保存条件。",["矿物颜料较稳定","湿度和光照会影响颜色","修复前需分析材料"])}),T({id:"dh-story",title:"故事画面",brief:"用图像讲述经典",x:67,y:57,coreExplanation:"壁画中的连续场景可以像漫画一样讲述故事，帮助观者理解宗教和伦理内容。",narration:"故事画面说明壁画不仅供观看，也承担教育和传播功能。",imagePrompt:"Narrative mural panels arranged like sequential scenes.",childImagePrompt:"Story panel card with scene order arrows.",detail:_("图像也能讲故事","在识字率有限的时代，图像叙事能让复杂故事被更多人理解和记住。",["连续场景组织情节","人物姿态提示关系","图像帮助传播观念"])}),T({id:"dh-donor",title:"供养人像",brief:"社会身份和服饰信息",x:37,y:76,coreExplanation:"供养人像记录了出资者、家族、服饰和时代信息，是理解社会历史的重要线索。",narration:"供养人像把宏大的宗教空间和真实历史人物连接起来。",imagePrompt:"Donor portraits in Dunhuang mural with clothing details.",childImagePrompt:"Donor figure detail card for clothing and inscription.",detail:_("供养人留下社会信息","人物服饰、题记和排列位置能反映身份、家族关系和当地社会结构。",["题记可提供姓名和年代","服饰反映身份和交流","排列位置体现礼仪秩序"])}),T({id:"dh-ceiling",title:"洞窟藻井",brief:"顶部图案与空间秩序",x:50,y:18,coreExplanation:"藻井常位于顶部中心，用几何、莲花和飞动图案组织洞窟的视觉中心。",narration:"藻井让洞窟顶部成为视觉中心，观者抬头时会感到空间被重新组织。",imagePrompt:"Dunhuang cave ceiling caisson pattern with lotus geometry.",childImagePrompt:"Ceiling pattern card with lotus and geometry.",detail:_("顶部也是叙事空间","洞窟不是平面画廊，墙壁、顶部和造像共同构成沉浸式图像空间。",["几何图案形成中心","莲花象征清净","顶部强化神圣感"])})]}),ge({id:"dunhuang-l2-apsaras",title:"飞天细节：飘带如何制造飞动感",pathLabel:"飞天细节",subtitle:"放大飘带、姿态、乐器、云气和面部线条。",fallbackTheme:"apsaras",imagePrompt:"Close view of Dunhuang apsaras ribbons, posture, instruments and cloud motifs.",coreExplanation:"飞天的“飞”不是靠翅膀，而是靠飘带方向、身体姿态、乐器节奏和云气线条共同暗示运动。",narration:"第二层看飞天。飘带显示风向和速度，身体姿态表现轻盈，乐器带来声音想象，云气托起空间，面部线条传递安静神情。",hotspots:[T({id:"dh-ribbon",title:"飘带",brief:"运动方向和节奏",x:42,y:43,coreExplanation:"飘带通过弧线、转折和重叠暗示身体正在移动，是飞动感的主要来源。",narration:"飘带像可见的风，帮观者读出飞天移动的方向。",imagePrompt:"Flowing ribbon line analysis in Dunhuang apsaras.",childImagePrompt:"Ribbon motion diagram card.",detail:_("飘带是运动线","画家用飘带把静止墙面变成有方向的画面，弧线越连贯，飞动感越强。",["弧线暗示速度","重叠表现空间层次","方向引导视线移动"])}),T({id:"dh-posture",title:"身体姿态",brief:"轻盈与转身",x:51,y:52,coreExplanation:"身体扭转和手臂伸展让飞天看起来像正在空中转向，而不是平贴在墙面上。",narration:"身体姿态让飞天拥有重量变化和转身感。",imagePrompt:"Apsaras body posture with balance and turn arrows.",childImagePrompt:"Posture card showing torso twist and arm line.",detail:_("姿态制造空间","飞天的身体线条把平面扩展成空间，观者会想象人物正从远处飞来或转身离开。",["躯干扭转制造立体感","手臂延展连接飘带","腿部姿态减少沉重感"])}),T({id:"dh-instrument",title:"乐器",brief:"图像里的声音",x:61,y:47,coreExplanation:"飞天所持乐器让画面带有声音想象，也反映丝路音乐文化的交流。",narration:"点击乐器进入第三层，理解壁画如何把看不见的音乐画出来。",imagePrompt:"Dunhuang apsaras holding pipa and flute instruments.",childImagePrompt:"Musical instrument layer with pipa, drum, flute and rhythm marks.",targetLevelId:"dunhuang-l3-music"}),T({id:"dh-cloud",title:"云气纹",brief:"托起空间感",x:34,y:63,coreExplanation:"云气纹让人物不再处于普通地面，而是进入神圣、轻盈和流动的空间。",narration:"云气纹像舞台环境，托起飞天的身体和故事氛围。",imagePrompt:"Cloud motif around Dunhuang apsaras.",childImagePrompt:"Cloud motif detail card.",detail:_("云气组织空间","云气并非简单装饰，它把人物、飘带和背景连接成连续的空中场景。",["增强轻盈感","分隔不同画面区域","呼应宗教空间想象"])}),T({id:"dh-face",title:"面部线条",brief:"神情与时代风格",x:55,y:35,coreExplanation:"面部线条和眉眼样式体现绘画时代与审美取向，也影响观者对人物气质的感受。",narration:"面部线条细小却关键，它让飞天不只是动作，也有神情。",imagePrompt:"Apsaras face contour and eyebrow line close-up.",childImagePrompt:"Face line style card.",detail:_("神情来自线条","眉眼、鼻线和嘴角的处理会改变人物气质，也是判断风格和时代的重要细节。",["线条决定神情","风格会随时代变化","保护中需避免过度补画"])})]}),ge({id:"dunhuang-l3-music",title:"壁画音乐：看见声音的五个线索",pathLabel:"壁画音乐",subtitle:"从琵琶、鼓、笛、节奏线和舞者回应理解声音如何入画。",fallbackTheme:"dunhuang-music",imagePrompt:"Dunhuang mural music ensemble with pipa, drum, flute, rhythm lines and dancer response.",coreExplanation:"壁画无法真正发声，却能通过乐器形态、演奏姿态、人物关系和节奏线索让观者想象音乐现场。",narration:"第三层看壁画音乐。琵琶、鼓和笛子代表不同音色，节奏线让画面有律动，舞者回应说明音乐和身体动作是一起被组织的。",hotspots:[T({id:"dh-pipa",title:"琵琶",brief:"弦乐与手势",x:39,y:47,coreExplanation:"琵琶形态和演奏手势提示弦乐声音，也反映乐器传播和本土化过程。",narration:"琵琶让壁画里的音乐有了清晰的手势和音色想象。",imagePrompt:"Dunhuang pipa instrument detail in mural.",childImagePrompt:"Pipa detail card.",detail:_("乐器也是交流证据","乐器样式会随地域传播改变，壁画中的琵琶能帮助研究音乐文化交流。",["形态提示乐器类型","手势提示演奏方式","样式体现文化交流"])}),T({id:"dh-drum",title:"鼓",brief:"节拍和仪式感",x:53,y:60,coreExplanation:"鼓类乐器强调节拍，常把舞蹈、仪式和队列动作组织起来。",narration:"鼓声在画面中对应节奏，让飞天和舞者的动作更容易被想象。",imagePrompt:"Dunhuang mural drum with rhythm marks.",childImagePrompt:"Drum rhythm detail card.",detail:_("鼓负责组织节奏","在乐舞场景中，鼓不仅制造声音，也帮助多个表演者保持同步。",["提供稳定节拍","增强仪式氛围","连接音乐和舞蹈"])}),T({id:"dh-flute",title:"笛",brief:"旋律线索",x:64,y:43,coreExplanation:"管乐器让画面中的声音更有旋律想象，也提示丝路音乐中多种乐器并存。",narration:"笛声是画面里的旋律线索，让观者想象空气中的声音流动。",imagePrompt:"Dunhuang flute player in mural style.",childImagePrompt:"Flute melody detail card.",detail:_("旋律从姿态中出现","虽然听不到声音，但吹奏姿态、乐器角度和人物表情会提示旋律正在发生。",["提示旋律性声音","丰富乐队层次","体现乐器组合"])}),T({id:"dh-rhythm-lines",title:"节奏线",brief:"让静态画面动起来",x:48,y:34,coreExplanation:"飘带、云纹和人物排列形成节奏线，替代真实时间中的音乐节拍。",narration:"节奏线让静止画面拥有时间感，像把音乐节拍画在墙上。",imagePrompt:"Rhythm lines through ribbons, clouds and figures.",childImagePrompt:"Visual rhythm analysis card.",detail:_("线条可以表现时间","连续弧线和重复图案会让观者按顺序观看，从而产生节奏和时间感。",["重复形成节拍","弧线引导视线","人物排列制造序列"])}),T({id:"dh-dancer",title:"舞者回应",brief:"音乐和身体动作互相证明",x:72,y:66,coreExplanation:"舞者姿态说明音乐不是孤立声音，而是与身体、仪式和观看者共同发生。",narration:"舞者回应让乐器不只是物件，而成为一场表演的一部分。",imagePrompt:"Dunhuang dancer responding to music with flowing sleeves.",childImagePrompt:"Dance response detail card.",detail:_("音乐需要身体回应","乐舞场景中，声音、动作、服饰和空间一起构成完整体验。",["动作显示节拍","服饰放大动态","表演连接观众和信仰"])})]})]},{id:"curated-black-hole",title:"黑洞",category:"科学百科",scenario:"天文科普 / STEM 探索课",summary:"从事件视界、吸积盘和引力透镜进入黑洞结构与极端引力。",rootLevelId:"black-hole-l1",levels:[ge({id:"black-hole-l1",title:"黑洞：看不见的引力边界",pathLabel:"黑洞总览",subtitle:"观察事件视界、吸积盘、喷流、引力透镜和背景星场。",fallbackTheme:"black-hole",imagePrompt:"Black hole encyclopedia visual with event horizon, accretion disk, jet and star field.",coreExplanation:"黑洞本身不发光，我们能认识它，主要依靠周围物质发光、光线被弯曲、喷流和恒星运动等间接线索。",narration:"这一层看黑洞总览。事件视界定义不可返回边界，吸积盘发出强光，喷流沿轴向喷出，引力透镜弯曲背景星光，星场变化帮助我们推断黑洞存在。",hotspots:[T({id:"bh-horizon",title:"事件视界",brief:"不可返回边界",x:50,y:50,coreExplanation:"事件视界不是实体表面，而是一个边界：一旦越过，连光也无法逃离。",narration:"点击事件视界进入第二层，理解黑洞边界、光子环和时间效应。",imagePrompt:"Event horizon ring around black hole shadow.",childImagePrompt:"Event horizon layer with photon sphere and tidal gradient.",targetLevelId:"black-hole-l2-horizon"}),T({id:"bh-disk",title:"吸积盘",brief:"发光的旋转物质",x:54,y:61,coreExplanation:"吸积盘由高速旋转的气体和尘埃组成，摩擦和压缩让它变热发光。",narration:"吸积盘让看不见的黑洞拥有可观察的光环。",imagePrompt:"Bright accretion disk around a black hole with heat colors.",childImagePrompt:"Accretion disk detail card.",detail:_("吸积盘照亮黑洞周围","物质落入黑洞前会被加速、压缩并升温，因此吸积盘常是观测黑洞的重要线索。",["高速旋转产生强烈辐射","温度和亮度分布不均","形状受相对论效应影响"])}),T({id:"bh-jet",title:"相对论喷流",brief:"沿轴向喷出的高能物质",x:50,y:22,coreExplanation:"部分黑洞系统会沿旋转轴喷出高速物质，形成横跨巨大尺度的喷流。",narration:"喷流说明黑洞周围不仅有坠落，也可能有高能物质被抛射出去。",imagePrompt:"Relativistic jet from black hole poles.",childImagePrompt:"Jet detail card with magnetic field lines.",detail:_("喷流来自极端环境","喷流通常与强磁场、旋转和吸积盘有关，是黑洞影响周围宇宙环境的重要方式。",["速度接近光速","沿旋转轴方向延伸","可能影响星系尺度环境"])}),T({id:"bh-lensing",title:"引力透镜",brief:"弯曲背景星光",x:67,y:42,coreExplanation:"黑洞强引力会弯曲附近光线，使背景星光产生扭曲、放大或环状影像。",narration:"引力透镜让我们通过光的弯曲看到质量的存在。",imagePrompt:"Gravitational lensing around black hole bending star light.",childImagePrompt:"Lensing detail card with curved light paths.",detail:_("光线也会被引力改变路径","在强引力场中，光并不是直线穿过空间，而是沿弯曲的时空路径传播。",["背景星光会变形","可间接推断质量分布","强透镜可能形成环状结构"])}),T({id:"bh-starfield",title:"背景星场",brief:"用恒星运动推断黑洞",x:28,y:37,coreExplanation:"恒星绕看不见的大质量天体高速运动，是发现黑洞的重要证据之一。",narration:"背景星场不是装饰，恒星轨道可以揭示看不见的黑洞质量。",imagePrompt:"Star field with orbital trails around invisible mass.",childImagePrompt:"Stellar orbit evidence card.",detail:_("看恒星如何绕行","如果多颗恒星围绕一个不可见中心高速运动，研究者就能估算中心天体质量。",["轨道速度反映质量","长期观测很关键","可发现不可见天体"])})]}),ge({id:"black-hole-l2-horizon",title:"事件视界：边界附近发生什么",pathLabel:"事件视界",subtitle:"放大边界、光子球、潮汐梯度、黑洞阴影和时间膨胀。",fallbackTheme:"event-horizon",imagePrompt:"Event horizon detail with boundary, photon sphere, shadow and time dilation labels.",coreExplanation:"事件视界附近的空间不再符合日常直觉。光路、时间、潮汐力和观测影像都会被强引力显著改变。",narration:"第二层进入事件视界附近。边界决定不可返回，光子球让光绕行，潮汐梯度会拉伸物体，黑洞阴影是可观测轮廓，时间膨胀则改变远近观察者的时间体验。",hotspots:[T({id:"bh-boundary",title:"边界位置",brief:"不是固体表面",x:50,y:51,coreExplanation:"事件视界是时空边界而非物质表面，穿过它不会撞上外壳，却无法再向外传递信息。",narration:"事件视界像一条规则边界，而不是一堵墙。",imagePrompt:"Invisible boundary line around black hole, no solid surface.",childImagePrompt:"Boundary concept detail card.",detail:_("边界不是外壳","事件视界定义逃逸速度超过光速的位置，它描述的是信息能否逃离，而不是物体表面。",["没有固体表面","越过后无法向外传递信息","边界大小与质量有关"])}),T({id:"bh-photon",title:"光子球",brief:"光也可能绕行",x:58,y:42,coreExplanation:"在极强引力下，某些光线能围绕黑洞短暂绕行，形成复杂的光路结构。",narration:"光子球说明黑洞附近连光的路径都会变得不稳定。",imagePrompt:"Photon sphere light orbit around black hole.",childImagePrompt:"Photon orbit detail card.",detail:_("光的危险轨道","光子球附近的光路极不稳定，微小偏差就会决定光逃走还是落入黑洞。",["光线可短暂绕行","轨道非常不稳定","影响黑洞影像边缘"])}),T({id:"bh-tidal-gradient",title:"潮汐梯度",brief:"近端和远端受力不同",x:41,y:64,coreExplanation:"靠近黑洞一侧受到的引力比远离一侧更强，差异可能把物体拉长。",narration:"点击潮汐梯度进入第三层，理解极端引力如何拉伸物体。",imagePrompt:"Tidal force gradient near black hole stretching object.",childImagePrompt:"Tidal force layer with near side pull, far side pull and stretch axis.",targetLevelId:"black-hole-l3-tidal"}),T({id:"bh-shadow",title:"黑洞阴影",brief:"望远镜看到的暗区",x:50,y:50,coreExplanation:"黑洞阴影不是黑洞实体照片，而是光线被捕获后留下的暗区轮廓。",narration:"黑洞阴影是观察强引力的窗口，但它不是普通意义的表面照片。",imagePrompt:"Black hole shadow with bright ring around it.",childImagePrompt:"Shadow observation detail card.",detail:_("阴影是光路结果","事件视界望远镜拍到的环状图像，来自周围发光物质和被黑洞捕获的光路共同作用。",["暗区对应光难以逃离的区域","亮环来自周围发光物质","影像需要大量数据重建"])}),T({id:"bh-time",title:"时间膨胀",brief:"强引力改变时间流逝",x:70,y:61,coreExplanation:"越靠近强引力源，相对远方观察者而言时间流逝越慢。",narration:"时间膨胀提醒我们，黑洞附近改变的不只是空间，还有时间。",imagePrompt:"Time dilation clocks near and far from black hole.",childImagePrompt:"Clock comparison detail card.",detail:_("时间不是绝对背景","广义相对论中，引力会影响时间流逝。黑洞附近这种效应尤其明显。",["近处时间相对变慢","远方观察者看到不同节奏","与强引力时空弯曲有关"])})]}),ge({id:"black-hole-l3-tidal",title:"潮汐力：为什么物体会被拉长",pathLabel:"潮汐力",subtitle:"从近端拉力、远端拉力、拉伸轴、物质流和安全距离理解极端引力。",fallbackTheme:"tidal-force",imagePrompt:"Tidal force diagram near black hole with stretch axis and matter stream.",coreExplanation:"潮汐力来自同一个物体不同部位受到的引力差。越靠近小而致密的黑洞，这种差异可能越剧烈。",narration:"第三层看潮汐力。近端被更强拉向黑洞，远端拉力较弱，物体沿拉伸轴变长，物质可能形成流，安全距离则取决于黑洞质量和接近路径。",hotspots:[T({id:"bh-near-pull",title:"近端拉力",brief:"受力更强的一侧",x:43,y:50,coreExplanation:"靠近黑洞的一端受到更强引力，是物体被拉伸的主要原因之一。",narration:"近端拉力更强，会率先改变物体形状。",imagePrompt:"Near side of object pulled strongly by black hole.",childImagePrompt:"Near side pull detail card.",detail:_("差异来自距离","引力随距离变化，物体靠近黑洞的一端和远离的一端距离不同，因此受力不同。",["距离越近受力越强","差异越大拉伸越明显","小黑洞附近效应更剧烈"])}),T({id:"bh-far-pull",title:"远端拉力",brief:"受力较弱的一侧",x:61,y:50,coreExplanation:"远端仍被黑洞吸引，但受力小于近端，于是整个物体被沿径向拉长。",narration:"远端不是不受力，而是比近端弱，差异才是关键。",imagePrompt:"Far side of object with weaker gravitational pull arrows.",childImagePrompt:"Far side pull comparison card.",detail:_("弱一点也会造成拉伸","潮汐力关注的是力的差值，不是单个位置的力有多大。",["远端仍被吸引","与近端形成受力差","差值决定拉伸趋势"])}),T({id:"bh-stretch-axis",title:"拉伸轴",brief:"沿黑洞方向变长",x:52,y:42,coreExplanation:"物体会沿指向黑洞的方向拉长，同时横向可能被压缩。",narration:"拉伸轴显示物体变形的方向，不是随意扭曲。",imagePrompt:"Stretch axis pointing toward black hole with compression arrows.",childImagePrompt:"Stretch and compression detail card.",detail:_("方向决定形变","潮汐力通常沿径向拉伸、横向压缩，这种方向性来自引力场的空间变化。",["径向拉伸","横向压缩","方向由引力中心决定"])}),T({id:"bh-matter-stream",title:"物质流",brief:"被剥离的气体轨迹",x:70,y:63,coreExplanation:"恒星或气体云被潮汐力撕裂后，物质可能形成细长流并逐渐落入吸积盘。",narration:"物质流把看不见的潮汐力变成可观测的发光轨迹。",imagePrompt:"Matter stream from disrupted star toward black hole.",childImagePrompt:"Matter stream detail card.",detail:_("撕裂后仍会发光","被剥离的气体会升温并辐射，让天文学家有机会观测潮汐撕裂事件。",["气体被拉成细流","升温后发出辐射","可成为观测证据"])}),T({id:"bh-safe-distance",title:"安全距离",brief:"质量和路径共同决定风险",x:30,y:65,coreExplanation:"是否被撕裂取决于黑洞质量、物体结构、接近速度和最短距离。",narration:"安全距离不是固定数字，而是由黑洞和接近物体共同决定。",imagePrompt:"Safe approach distance rings around black hole.",childImagePrompt:"Risk di 为什么像天然雪鞋",subtitle:"宽大的足部让身体重量分散，也让跳跃落地更稳定",visualHint:"snow-paw",imagePath:"generated-images/curated/learning-snow-leopard-paw-l2.png",explanation:"雪豹的脚掌相对宽大，脚底覆盖毛发，像天然雪鞋一样把身体重量分散在更大的接触面积上。这样能减少陷入雪中的概率，也能在岩石、碎坡和冰雪交错的地面上保持抓地力。",keyPoints:["宽脚掌可以分散压力，让雪豹在松软雪面上更容易移动。","脚底毛发既能保暖，也能增加与地面的摩擦。","后肢力量强，配合长尾平衡，使雪豹能在峭壁间跳跃。","身体结构与栖息地之间存在高度匹配关系。"],misconceptions:["宽脚掌不是为了“游泳”，而是适应雪地和岩石地形。","雪豹能跳得远，不只是因为腿长，还与肌肉、尾巴和地形判断有关。"],nextSuggestions:["脚印识别","长尾平衡","雪坡伏击","高山适应"],knowledgeCard:["宽脚掌能降低单位面积压力。","脚底毛发提供保暖和防滑效果。","长尾帮助雪豹在跳跃和转身时稳定身体。","身体结构是环境长期选择的结果。"],explorationQuestions:["同样生活在雪地的动物还有哪些“雪鞋”式适应？","如果脚掌较窄，雪豹在雪坡上会遇到什么困难？","观察脚印时，研究者可以获得哪些信息？"],reviewCard:"从宽脚掌可以看出，雪豹的身体并非孤立特征，而是与雪地、岩壁和捕猎方式共同形成适应系统。"},{id:"snow-leopard-3",channel:"动物百科",title:"岩羊、雪豹和高山食物链",subtitle:"一条看不见的生态关系，把草坡、食草动物和捕食者连起来",visualHint:"mountain-chain",imagePath:"generated-images/curated/learning-snow-leopard-food-chain-l3.png",explanation:"岩羊等高山食草动物取食草本植物，雪豹则捕食岩羊等动物。这个关系不是简单的“吃与被吃”，而是高山生态平衡的一部分。若猎物减少，雪豹可能更接近牧区；若捕食者消失，食草动物数量也可能改变植被压力。",keyPoints:["食物链连接了植物、食草动物和捕食者。","雪豹数量变化会影响猎物行为和高山生态结构。","牧区、野生动物和保护区之间需要协调管理。","保护顶级捕食者常常能带动整个生态系统保护。"],misconceptions:["保护雪豹不是只保护一种漂亮动物，而是保护一套生态关系。","捕食者并非生态系统中的“坏角色”，它们也维持数量和行为平衡。"],nextSuggestions:["草坡生态","牧民共存","红外监测","生态廊道"],knowledgeCard:["高山食物链从植物开始，经岩羊等食草动物传递到雪豹。","顶级捕食者影响猎物数量和活动位置。","人类牧业活动会与野生动物栖息地发生交叠。","保护需要同时考虑动物、牧民和栖息地。"],explorationQuestions:["如果岩羊数量下降，雪豹可能会如何改变行为？","为什么生态廊道对大型动物很重要？","人与雪豹共存需要哪些社区层面的办法？"],reviewCard:"这一路径从雪豹身体结构走到高山食物链，理解了个体适应与生态系统之间的联系。"}]},{id:"whale-song",channel:"动物百科",title:"鲸鱼为什么会唱歌",summary:"进入海洋声音世界，理解鲸歌、传播和迁徙社交。",visualHint:"whale",layers:[{id:"whale-1",channel:"动物百科",title:"鲸鱼为什么会唱歌：海洋里的声音世界",subtitle:"在光线难以穿透的海里，声音成为远距离连接方式",visualHint:"whale",imagePath:"generated-images/curated/learning-whale-song-l1.png",explanation:"许多鲸类会发出复杂声音，用于交流、定位、求偶或维持群体联系。海水能让低频声音传播很远，因此“鲸歌”不仅是美妙的自然现象，也是一套适应海洋环境的信息系统。",keyPoints:["声音在海水中传播效率高，适合远距离交流。","不同鲸类的声音频率、节奏和用途并不完全相同。","鲸歌可能与求偶、群体联系和迁徙路线有关。","船舶噪声会干扰鲸类的声音交流。"],misconceptions:["鲸歌不是人类意义上的歌曲表演，而是动物沟通的一种方式。","不是所有鲸都会发出完全相同的声音，不同种类差异很大。"],nextSuggestions:["声波传播","鲸类迁徙","海洋噪声","求偶信号"],knowledgeCard:["鲸鱼使用声音在海洋中交流。","低频声音可以在海水中传播很远。","鲸歌可能承担求偶、联系和导航等功能。","人类活动产生的噪声会影响鲸类生活。"],explorationQuestions:["为什么海洋动物比陆地动物更依赖声音？","船舶噪声会怎样改变鲸类行为？","科学家如何记录和分析鲸歌？"],reviewCard:"本页理解了鲸歌的核心：海洋环境让声音成为鲸类远距离沟通的重要工具。"},{id:"whale-2",channel:"动物百科",title:"声波如何在海水中传播",subtitle:"温度、盐度和深度共同改变海洋声音的旅行路线",visualHint:"sound-wave",imagePath:"generated-images/curated/learning-whale-sound-wave-l2.png",explanation:"声波在海水中的传播速度通常比空气中更快，并会受到温度、盐度和压力影响。在某些深度，声音可以沿着特殊声道传播很远，这让鲸类的低频叫声有机会跨越大范围海域。",keyPoints:["海水密度较高，声波传播速度通常高于空气中。","低频声音衰减慢，更适合远距离传播。","海水温度、盐度和深度会改变声速与传播路径。","海洋噪声会让鲸类更难接收同伴信号。"],misconceptions:["声音在海里不是直线无限传播，会受到海洋环境层次影响。","鲸歌传播远不等于总能被清晰接收，噪声和距离都会削弱信息。"],nextSuggestions:["低频声音","海洋声道","船舶噪声","科学监听"],knowledgeCard:["声波在海水中传播快，低频声音传播距离更远。","温度、盐度、深度会影响声速。","海洋声学帮助人类研究鲸类行为。","减少噪声污染有助于保护海洋生物。"],explorationQuestions:["为什么低频声音比高频声音更适合远距离沟通？","如果海洋温度变化，声音传播路径可能会怎样改变？","海洋保护区能否同时管理“声音环境”？"],reviewCard:"声波传播解释了鲸歌为什么能跨越海域，也提醒我们海洋噪声会成为看不见的干扰。"},{id:"whale-3",channel:"动物百科",title:"鲸鱼迁徙与社交",subtitle:"跨越大洋的路线背后，是觅食、繁殖和群体联系",visualHint:"whale-migration",imagePath:"generated-images/curated/learning-whale-migration-l3.png",explanation:"许多鲸类会在觅食海域和繁殖海域之间长距离迁徙。声音帮助它们维持联系、寻找伴侣或在复杂海域中保持方向。迁徙路线也让鲸类与气候变化、渔业活动和航运路线发生关系。",keyPoints:["迁徙通常与食物季节变化和繁殖需求有关。","声音有助于个体之间保持联系。","不同海域承担觅食、繁殖和育幼等不同功能。","航运、渔网和气候变化都会影响鲸类迁徙。"],misconceptions:["鲸鱼迁徙不是漫无目的游动，而是与食物和繁殖周期有关。","保护鲸鱼不能只看单个地点，还要理解它们跨区域移动。"],nextSuggestions:["繁殖海域","觅食海域","航运避让","海洋保护网络"],knowledgeCard:["鲸类迁徙连接觅食区和繁殖区。","声音帮助鲸类社交和维持联系。","迁徙保护需要跨海域协作。","人类航运路线可能与鲸类路线重叠。"],explorationQuestions:["为什么保护迁徙动物需要多个国家或地区合作？","鲸类迁徙路线如何帮助我们理解海洋生态？","如果船舶改变航线，可能给鲸类带来什么帮助？"],reviewCard:"这一路径从鲸歌走到迁徙社交，理解了声音如何连接个体、海域和保护行动。"}]},{id:"tokyo-day",channel:"城市百科",title:"东京的一天",summary:"从地铁、街区和人流，看高密度城市如何有序运转。",visualHint:"tokyo",layers:[{id:"tokyo-1",channel:"城市百科",title:"东京的一天：高密度城市如何运转",subtitle:"从早高峰到夜间街区，观察城市系统的精密协作",visualHint:"tokyo",imagePath:"generated-images/curated/learning-tokyo-day-l1.png",explanation:"东京是世界上人口密度和交通复杂度都很高的都市之一。它的一天由地铁、步行街区、办公区、商业中心和居住区共同编织。理解东京，不只是看高楼，而是看不同系统如何按时间节奏协同。",keyPoints:["轨道交通承担大量通勤需求，是城市运转的基础网络。","车站周边常形成商业、办公和生活高度混合的街区。","城市秩序来自基础设施、规则和居民日常习惯共同作用。","高密度城市需要精细的空间管理和服务分布。"],misconceptions:["高密度不一定等于混乱，规划和交通组织可以提高效率。","东京不是单一中心城市，而是由多个功能中心组成的都市网络。"],nextSuggestions:["地铁网络","涩谷街口","便利店系统","车站商圈"],knowledgeCard:["东京的一天依赖轨道交通、街区功能和时间秩序。","车站是人流、商业和城市服务的交汇点。","多中心结构缓解单一核心压力。","高密度城市需要更精细的公共服务。"],explorationQuestions:["为什么东京的车站常常也是商业中心？","高密度城市如何保持出行效率？","一个城市的一天可以用哪些数据来观察？"],reviewCard:"本页从日常时间节奏认识东京：交通、街区和人流共同组成高密度城市的运行系统。"},{id:"tokyo-2",channel:"城市百科",title:"东京地铁网络为什么这么复杂",subtitle:"多家公司、多中心和高频换乘共同塑造轨道网",visualHint:"metro",imagePath:"generated-images/curated/learning-tokyo-metro-network-l2.png",explanation:"东京轨道交通由不同运营主体、不同线路和多层换乘站组成。复杂不是目的，而是为了连接分散的居住区、商业中心和办公区。线路之间像毛细血管一样把城市活动输送到不同节点。",keyPoints:["多中心城市需要线路连接多个核心区域。","换乘站让不同线路互相衔接，提升可达性。","高频班次减少等待时间，支撑大规模通勤。","复杂网络需要清晰标识、时刻组织和站内动线。"],misconceptions:["线路多不一定意味着效率低，关键在换乘组织和运行频率。","地铁图不是实际地理比例图，而是帮助乘客理解连接关系的示意图。"],nextSuggestions:["换乘站设计","通勤潮汐","站内标识","多中心城市"],knowledgeCard:["东京地铁复杂源于多中心城市和巨大通勤需求。","换乘站是网络效率的关键节点。","地铁图强调连接关系，不完全等于真实距离。","高频运营让复杂网络保持可用。"],explorationQuestions:["为什么地铁图常常会扭曲真实地理距离？","一个好的换乘站需要解决哪些问题？","如果某条线路停运，城市网络会如何调整？"],reviewCard:"地铁网络复杂背后是城市结构复杂：多中心、换乘节点和高频运营共同支撑东京出行。"},{id:"tokyo-3",channel:"城市百科",title:"涩谷十字路口如何成为城市符号",subtitle:"一个路口如何被人流、媒体和商业共同塑造成记忆点",visualHint:"shibuya",imagePath:"generated-images/curated/learning-tokyo-crossing-l3.png",explanation:"涩谷十字路口以大规模人流同时穿越而闻名。它不仅是交通空间，也是商业影像、城市节奏和公共秩序的展示窗口。城市符号常常来自一个地点被反复观看、拍摄和讲述。",keyPoints:["十字路口把车流和人流用时间信号分离，提高通行秩序。","周边屏幕、商场和车站强化了视觉识别度。","媒体传播让日常交通空间变成城市名片。","城市符号背后往往有真实的基础设施支撑。"],misconceptions:["涩谷十字路口不是单纯“人多”，它还体现了交通规则和空间组织。","城市符号不是凭空出现，而是日常生活与传播共同塑造。"],nextSuggestions:["城市影像","步行空间","商业街区","公共秩序"],knowledgeCard:["涩谷十字路口是交通空间，也是城市符号。","信号系统让大规模人流有序穿越。","商业屏幕和媒体传播强化地点记忆。","城市名片通常来自空间、生活和叙事的叠加。"],explorationQuestions:["你的城市里有没有类似“城市符号”的地点？","为什么一个普通路口可以成为世界知名画面？","城市影像会如何影响游客对城市的想象？"],reviewCard:"这一路径从东京运转走到涩谷符号，理解了基础设施如何变成可被记住的城市形象。"}]},{id:"changan-silk-road",channel:"城市百科",title:"丝绸之路上的长安",summary:"在古代国际都市中观察贸易、制度和文化交流。",visualHint:"changan",layers:[{id:"changan-1",channel:"城市百科",title:"丝绸之路上的长安：古代国际都市",subtitle:"从城门、坊市和驼队进入东西交流的枢纽",visualHint:"changan",imagePath:"generated-images/curated/learning-changan-silk-road-l1.png",explanation:"长安曾是连接中国内地与丝绸之路的重要都市。商旅、使节、僧侣和工匠在这里汇聚，带来货物、语言、宗教、音乐和生活方式。它是一座城市，也是一张文明交流网络中的节点。",keyPoints:["长安位于交通和政治中心位置，具有强大聚集能力。","丝绸之路带来商品贸易，也带来知识和文化交流。","城市空间中的市场、寺院和街道承载不同人群活动。","国际都市的开放性与制度管理需要同时存在。"],misconceptions:["丝绸之路不只运输丝绸，还运输香料、玻璃器、知识和信仰。","古代国际交流不是单向传播，而是多地区、多群体互动。"],nextSuggestions:["东西方贸易","坊市制度","胡商群体","文化交流"],knowledgeCard:["长安是丝绸之路东端的重要都市节点。","贸易与文化交流常常同时发生。","城市制度影响商业活动和居民生活。","国际都市需要开放交流，也需要秩序管理。"],explorationQuestions:["为什么交通枢纽更容易成为国际都市？","货物交流如何带动语言、宗教和艺术传播？","古代城市如何管理来自不同地区的人群？"],reviewCard:"本页认识长安作为古代国际都市：它通过道路、市场和制度连接了远方世界。"},{id:"changan-2",channel:"城市百科",title:"东西方贸易如何进入长安",subtitle:"一支驼队带来的不只是货物，还有路线、信用和见闻",visualHint:"caravan",imagePath:"generated-images/curated/learning-changan-trade-l2.png",explanation:"丝绸之路上的货物往往经过多段转运进入长安。商旅沿绿洲、关隘和驿站移动，交换丝绸、马匹、香料、玻璃器和金银器。贸易网络需要道路安全、市场规则和跨文化信任。",keyPoints:["贸易路线由绿洲、关隘、驿站和城市节点组成。","货物可能经过多次转手，而非一支队伍走完全程。","贸易促进货币、度量、语言和契约形式的发展。","交通安全和政治稳定会影响贸易繁荣程度。"],misconceptions:["丝绸之路不是一条单一笔直道路，而是一组路线网络。","商旅交流并非只有买卖，还包含信息、技术和审美的传播。"],nextSuggestions:["绿洲城市","驿站系统","商品流动","商旅见闻"],knowledgeCard:["丝绸之路是一组跨区域路线网络。","货物进入长安常经历多段转运。","贸易依赖安全、规则和信任。","商品交换会带动信息和文化流动。"],explorationQuestions:["为什么绿洲城市会成为丝绸之路的重要节点？","一件玻璃器进入长安可能经历哪些中转？","贸易网络中“信任”为什么重要？"],reviewCard:"东西方贸易进入长安不是简单运输，而是路线、市场、制度和跨文化信任共同运作。"},{id:"changan-3",channel:"城市百科",title:"坊市制度、胡商与文化交流",subtitle:"城市空间如何安排交易，也如何承载多元生活",visualHint:"fangshi",imagePath:"generated-images/curated/learning-changan-cultural-exchange-l3.png",explanation:"唐代长安的坊市制度把居住区和市场空间相对分开，城市生活具有明确的空间秩序。来自不同地区的商人、使节和僧侣在市场与宗教空间中活动，让服饰、饮食、音乐和信仰相互影响。",keyPoints:["坊多与居住相关，市是重要商业活动空间。","胡商群体带来异域商品，也带来语言和生活方式。","文化交流常发生在市场、寺院、宴饮和表演空间。","制度秩序为大型城市的多元活动提供基本框架。"],misconceptions:["坊市制度不是简单“封闭”，它也体现古代城市管理方式。","文化交流不是只有精英参与，普通商人和市民生活也会被影响。"],nextSuggestions:["市场生活","宗教空间","音乐服饰","城市管理"],knowledgeCard:["坊市制度体现长安城市空间管理。","胡商连接商品贸易与文化交流。","市场和宗教空间是交流发生的重要场所。","多元文化需要城市制度提供秩序边界。"],explorationQuestions:["如果你是长安市场中的少年，会听到哪些语言和声音？","城市制度如何影响商业活力？","今天的国际都市与古代长安有哪些相似之处？"],reviewCard:"这一路径从长安走到坊市与胡商，理解了古代城市如何通过空间制度承载国际交流。"}]},{id:"qin-unification",channel:"历史百科",title:"秦始皇统一六国",summary:"从战国格局进入文字、货币、道路和中央集权。",visualHint:"qin",layers:[{id:"qin-1",channel:"历史百科",title:"秦始皇统一六国：从战国到大一统",subtitle:"一张地图的变化，背后是制度、军事和交通的重组",visualHint:"qin",imagePath:"generated-images/curated/learning-qin-unification-l1.png",explanation:"战国时期诸侯并立，秦国通过变法、军事扩张和制度建设逐步增强实力，最终完成统一。统一不仅意味着疆域变化，也意味着文字、货币、度量衡、道路和地方治理方式被重新整理。",keyPoints:["秦统一结束了长期诸侯割据局面，建立中央集权国家。","制度建设和军事能力共同推动统一过程。","统一之后需要解决治理范围扩大带来的管理问题。","文字、货币、度量衡等标准化降低了跨区域沟通成本。"],misconceptions:["统一不是一次战役完成的结果，而是长期政治、军事和制度积累。","疆域统一之后仍需要制度统一，才能让国家持续运转。"],nextSuggestions:["统一文字","统一货币","郡县制","道路系统"],knowledgeCard:["秦统一六国是从分裂走向大一统的重要历史事件。","军事扩张与制度能力共同发挥作用。","统一后标准化措施帮助国家治理。","中央集权需要地方制度和交通网络支撑。"],explorationQuestions:["为什么统一疆域之后还要统一文字和货币？","大范围国家治理会遇到哪些信息传递困难？","地图变化如何反映政治结构变化？"],reviewCard:"本页从战国到大一统，理解秦统一不仅是领土变化，更是制度和治理方式的重组。"},{id:"qin-2",channel:"历史百科",title:"统一文字和货币为什么重要",subtitle:"让命令、账目和交易跨越地域差异",visualHint:"standardization",imagePath:"generated-images/curated/learning-qin-standardization-l2.png",explanation:"在不同地区使用不同文字、货币和度量标准时，政令传达、税收登记和商业交换都会变得困难。统一文字和货币，是把分散区域纳入同一治理系统的重要工具。",keyPoints:["统一文字有利于政令、法律和文书在各地传播。","统一货币降低交易换算成本，便利跨区域商业。","统一度量衡让税收、工程和市场更容易管理。","标准化措施增强了中央对地方的治理能力。"],misconceptions:["统一文字不只是文化事件，也具有行政治理意义。","货币统一不等于商业自动繁荣，它还需要交通、安全和市场秩序配合。"],nextSuggestions:["小篆文字","半两钱","度量衡","政令传达"],knowledgeCard:["统一文字提高政令和法律传播效率。","统一货币便利跨区域交易。","度量衡统一支撑税收、工程和市场管理。","标准化是中央集权的重要基础。"],explorationQuestions:["如果各地使用不同单位，修建大型工程会遇到什么问题？","文字统一如何改变普通人的日常生活？","今天我们还依赖哪些标准化系统？"],reviewCard:"统一文字和货币让辽阔区域拥有共同沟通和交易规则，是国家治理的基础设施。"},{id:"qin-3",channel:"历史百科",title:"郡县制与道路系统如何服务中央集权",subtitle:"地方治理和交通线路共同构 geCard:["新航路开辟由经济欲望、技术条件和政治竞争共同推动。","航海技术让远洋探索更可行。","寻找替代商路是重要动力。","航线扩展会改变原有地区关系。"],explorationQuestions:["如果没有航海技术改进，新航路还会那么快出现吗？","为什么香料在当时具有巨大吸引力？","开辟航线的人和被抵达地区的人会如何不同地讲述这段历史？"],reviewCard:"新航路的开辟不是偶然冒险，而是经济、技术、政治和观念共同推动的结果。"},{id:"navigation-3",channel:"历史百科",title:"贸易、殖民与文明碰撞",subtitle:"世界被连接，也被重新分配权力、资源和风险",visualHint:"global-exchange",imagePath:"generated-images/curated/learning-age-discovery-global-impact-l3.png",explanation:"新航线带来跨洲贸易和物种交流，也带来殖民统治、奴隶贸易、疾病传播和文化冲突。理解大航海时代，需要同时看到全球联系扩大与不平等关系加深。",keyPoints:["跨洲贸易让金银、作物、商品和人口大规模流动。","殖民扩张改变许多地区的政治、经济和社会结构。","文明相遇既有交流，也有冲突和强制支配。","全球化早期历史包含技术、商业与暴力交织。"],misconceptions:["“交流”不总是平等互惠，有时伴随强迫和剥削。","不能只从航海者视角理解历史，也要看被殖民地区的经验。"],nextSuggestions:["哥伦布大交换","奴隶贸易","殖民城市","多视角历史"],knowledgeCard:["大航海时代加速全球贸易和物种交流。","殖民扩张带来资源掠夺和社会破坏。","文明碰撞包含交流、冲突和权力不平等。","历史理解需要多视角，而不是单一英雄叙事。"],explorationQuestions:["为什么“世界连接”可能同时带来机会和伤害？","如何从被殖民地区视角重新讲述大航海时代？","今天的全球联系与早期全球化有哪些延续和不同？"],reviewCard:"这一路径从航线开辟走到文明碰撞，理解了世界连接背后的贸易扩展、殖民权力和多视角历史。"}]},{id:"notre-dame-memory",channel:"城市百科",title:"巴黎圣母院：建筑、历史与城市记忆",summary:"从哥特式结构、玫瑰窗和城市修复，看一座建筑如何承载公共记忆。",visualHint:"architecture",layers:[{id:"notre-dame-1",channel:"城市百科",title:"巴黎圣母院：建筑、历史与城市记忆",subtitle:"从塞纳河畔的教堂整体进入建筑、城市和公共记忆",visualHint:"architecture",imagePath:"generated-images/curated/curated-shanghai-bund-l3.png",explanation:"巴黎圣母院不只是一个宗教建筑，也是巴黎城市记忆的核心地标。它的立面、尖拱、玫瑰窗、飞扶壁和修复过程，把建筑技术、历史事件、文学想象和公共空间连接在一起。",keyPoints:["巴黎圣母院是理解哥特式建筑结构的重要入口。","建筑立面和城市位置共同塑造公共地标。","火灾与修复让历史建筑保护成为当代公共议题。","同一建筑可以从建筑学、历史学、城市导览和文化记忆多视角理解。"],misconceptions:["历史建筑不是静止展品，它会随修复、参观和城市叙事持续变化。","哥特式建筑不只是装饰风格，也是一套结构和光线组织方法。"],nextSuggestions:["哥特式结构","玫瑰窗","飞扶壁","城市记忆"],knowledgeCard:["巴黎圣母院连接建筑结构、宗教空间和城市记忆。","哥特式建筑通过尖拱、肋 vault 和飞扶壁组织高度与光线。","玫瑰窗既是视觉中心，也承载宗教叙事。","修复过程让公众重新讨论历史建筑如何延续。"],explorationQuestions:["为什么巴黎圣母院能成为城市共同记忆？","建筑修复应该恢复原貌，还是留下时代痕迹？","如果从旅行导览视角讲解，最应该先看哪一处？"],reviewCard:"本页从巴黎圣母院整体导览开始，把建筑结构、历史事件和城市记忆放在同一张视觉知识地图中理解。"},{id:"notre-dame-2",channel:"城市百科",title:"哥特式建筑结构如何把重量变成高度",subtitle:"尖拱、肋 vault 与飞扶壁让建筑更高、更亮、更开放",visualHint:"architecture-structure",imagePath:"generated-images/curated/curated-shanghai-bund-l3.png",explanation:"哥特式建筑并不是单靠装饰显得高耸。尖拱改变受力方向，肋 vault 把顶部重量导向支撑点，飞扶壁把侧推力传到外部支撑结构。结构创新让墙面可以打开更大的窗户，引入彩色光线。",keyPoints:["尖拱帮助把力更有效地导向柱和墙体。","肋 vault 让屋顶结构更清晰，也方便形成高大空间。","飞扶壁把侧向推力转移到外部支撑。","结构创新为更大的彩窗和更明亮的室内空间创造条件。"],misconceptions:["飞扶壁不是附加装饰，而是重要的受力结构。","哥特式建筑的高度感来自结构、光线和比例共同作用。"],nextSuggestions:["尖拱受力","肋 vault","飞扶壁","光线组织"],knowledgeCard:["哥特式建筑把结构工程和宗教空间体验结合起来。","受力逻辑决定建筑能否向上生长。","外部支撑让内部墙面更开放。","建筑结构可以直接改变人的空间感受。"],explorationQuestions:["如果没有飞扶壁，墙面和彩窗会受到什么限制？","为什么“向上”的空间感会影响宗教建筑体验？","现代建筑还会用哪些方式解决受力和采光问题？"],reviewCard:"这一层把巴黎圣母院拆成结构系统，理解哥特式建筑如何通过工程逻辑创造精神性空间。"},{id:"notre-dame-3",channel:"城市百科",title:"玫瑰窗、飞扶壁与城市记忆",subtitle:"从细部看建筑如何被观看、修复和反复讲述",visualHint:"rose-window",imagePath:"generated-images/curated/curated-dunhuang-linework-l3.png",explanation:"玫瑰窗把宗教故事、几何秩序和彩色光线汇聚在一起；飞扶壁让建筑外部结构成为城市天际线的一部分。当火灾和修复发生后，公众关注的不只是建筑本身，也是在讨论一座城市如何保存共同记忆。",keyPoints:["玫瑰窗用图像、几何和彩色玻璃组织叙事。","飞扶壁让结构细节变成可识别的城市轮廓。","历史建筑的修复会牵动公众情感和专业争议。","城市记忆来自建筑、文学、影像、旅游和公共事件的叠加。"],misconceptions:["城市记忆不是只由历史年代决定，也由公众如何观看和讲述决定。","建筑细部并非孤立装饰，它们常常承载结构、信仰和传播意义。"],nextSuggestions:["彩窗叙事","修复伦理","城市地标","公共记忆"],knowledgeCard:["玫瑰窗是建筑细部，也是图像叙事系统。","飞扶壁把结构逻辑外显为城市景观。","修复历史建筑需要平衡真实性、安全和公众期待。","地标建筑会成为城市身份的一部分。"],explorationQuestions:["为什么一次火灾会引发全球关注？","修复历史建筑时，哪些部分应该被保留或重建？","你所在城市有哪些建筑承载共同记忆？"],reviewCard:"从玫瑰窗和飞扶壁进入城市记忆，可以看到建筑不只是空间，也是被时代不断解释的公共文化内容。"}]},{id:"tokyo-metro-system",channel:"城市百科",title:"东京地铁：超大城市如何运行",summary:"用轨道网络、通勤结构和站点商业理解超大城市系统。",visualHint:"metro",layers:[{id:"tokyo-metro-system-1",channel:"城市百科",title:"东京地铁：超大城市如何运行",subtitle:"从城市交通全景进入轨道网络、人流组织和日常生活",visualHint:"tokyo",imagePath:"generated-images/curated/learning-tokyo-day-l1.png",explanation:"东京地铁和轨道交通系统把居住区、办公区、商业中心和城市公共服务连接起来。理解它，不只是看线路数量，而是看一个超大城市如何通过网络、时间表和节点组织日常生活。",keyPoints:["轨道网络承担超大规模通勤，是城市运行底层骨架。","车站既是交通节点，也是商业和服务入口。","多中心结构减少单一中心压力，也提高换乘需求。","东京地铁适合展示时间机器和城市规划师视角。"],misconceptions:["线路复杂不等于混乱，关键在换乘组织和运营频率。","地铁不是孤立交通工 gent",imagePath:"generated-images/curated/curated-black-hole-level-1.png",explanation:"AI Agent 不是一个单独按钮，而是一套把模型能力、工具调用、上下文记忆、任务规划和业务工作流连接起来的生态。理解它，需要同时看技术结构、产品形态和商业落地。",keyPoints:["模型提供理解、生成和推理能力，是 Agent 的核心引擎。","工具和 Skill 让 Agent 能访问文件、网页、数据库和业务系统。","工作流把复杂任务拆成可执行步骤，决定稳定性和可控性。","商业化通常发生在垂直场景、企业流程和平台生态中。"],misconceptions:["Agent 不是简单聊天机器人，它更强调行动、工具和流程。","模型越强不代表落地越容易，数据、权限、评估和集成同样关键。"],nextSuggestions:["模型能力","工具调用","Skill 与工作流","商业化路径"],knowledgeCard:["AI Agent 生态由模型、工具、记忆、流程和场景组成。","工具调用决定 Agent 能否真正完成任务。","企业落地需要安全、权限和评估体系。","平台化会推动 Agent 从单点应用走向生态网络。"],explorationQuestions:["一个 Agent 和一个聊天助手最大的差异是什么？","企业为什么关心权限、审计和可控性？","哪些行业场景最适合先落地 Agent？"],reviewCard:"本页从生态全景进入 AI Agent，重点是把模型能力放回工具、工作流和商业场景中理解。"},{id:"ai-agent-2",channel:"成人通识",title:"模型、工具、Skill 与工作流",subtitle:"Agent 如何把“会说”变成“会做”",visualHint:"workflow",imagePath:"generated-images/curated/curated-black-hole-event-horizon-l2.png",explanation:"模型负责理解意图和生成计划，工具负责连接外部系统，Skill 封装可复用能力，工作流则约束执行顺序和状态。四者组合起来，Agent 才能从回答问题走向完成任务。",keyPoints:["模型决定理解和规划能力，但不能替代外部工具。","工具调用让 Agent 能读写文件、调用系统和完成操作。","Skill 把常见能力封装为更稳定的复用模块。","工作流让任务可追踪、可恢复、可评估。"],misconceptions:["工具越多不一定越好，关键是权限边界和任务匹配。","自动化不等于完全无人参与，复杂任务仍需要人类确认。"],nextSuggestions:["工具权限","任务规划","状态记忆","人工确认"],knowledgeCard:["Agent 的行动能力来自模型与工具系统的组合。","Skill 是可复用能力单元。","工作流帮助控制复杂任务质量。","人机协作是企业 Agent 落地的重要形态。"],explorationQuestions:["什么任务适合封装成 Skill？","什么时候 Agent 应该请求人类确认？","如何评估一个 Agent 是否真的完成了任务？"],reviewCard:"这一层把 Agent 拆成模型、工具、Skill 和工作流，理解它如何从生成内容走向执行业务任务。"},{id:"ai-agent-3",channel:"成人通识",title:"商业化、平台化和企业落地",subtitle:"从单点效率工具到企业级流程基础设施",visualHint:"business-model",imagePath:"generated-images/curated/curated-black-hole-accretion-disk-l3.png",explanation:"AI Agent 的商业化不只来自个人效率工具，也来自企业流程改造、垂直行业应用和平台生态。真正落地时，需要把模型成本、数据安全、权限体系、用户体验和业务指标放在一起评估。",keyPoints:["企业愿意为可衡量的效率提升和流程自动化付费。","平台化会把模型、工具、应用和开发者连接起来。","安全、权限、日志和评估是企业采购的重要门槛。","垂直行业 Agent 更容易形成清晰 ROI。"],misconceptions:["Agent 商业化不是简单卖模型调用量，而是交付业务结果。","通用 Agent 不一定适合所有企业流程，场景适配很重要。"],nextSuggestions:["企业流程","平台生态     <script>
      (() => {
        const explorePath =
          window.location.protocol === "file:"
            ? "http://localhost:3000/infinite-explore"
            : "/infinite-explore";
        const normalize = (value) => (value || "").replace(/\s+/g, " ").trim();
        const shouldOpenExplore = (label) =>
          label === "无限探索" ||
          label.includes("开始自由探索");

        document.addEventListener(
          "click",
          (event) => {
            const target = event.target.closest("button,a,[role='button']");
            if (!target) return;
            const label = normalize(target.textContent);
            if (!shouldOpenExplore(label)) return;
            event.preventDefault();
            event.stopPropagation();
            window.location.href = explorePath;
          },
          true,
        );
      })();
